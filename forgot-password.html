<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password · Stockpile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-shell">
  <section class="auth-side">
    <div class="auth-brand"><span class="mark">S</span> Stockpile</div>
    <div class="auth-pitch">
      <h1>We'll get you back in.</h1>
      <p>Enter the email on your account and we'll send a link to reset your password.</p>
    </div>
    <div class="auth-foot">© <span id="year"></span> Stockpile. Built for independent retailers.</div>
  </section>

  <section class="auth-form-side">
    <div class="auth-card">
      <a href="login.html" class="back-link"><span id="icon-back"></span> Back to log in</a>
      <h2>Reset your password</h2>
      <p class="lead">We'll email you a secure reset link.</p>

      <div id="auth-alert" class="auth-alert" style="display:none;"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="email">Email address</label>
          <input class="input" type="email" id="email" placeholder="you@business.com" autocomplete="email" required>
          <div class="error-msg" id="email-error"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-block" id="reset-submit">
          <span id="reset-btn-text">Send reset link</span>
        </button>
      </form>
    </div>
  </section>
</div>

<script type="module">
  import { resetPassword, friendlyFirebaseError } from "./js/auth.js";
  import { validate } from "./js/utils.js";
  import { Icons } from "./js/icons.js";

  document.getElementById("year").textContent = new Date().getFullYear();
  document.getElementById("icon-back").innerHTML = Icons.svg("chevronLeft");

  function showAlert(msg, success = false) {
    const alertEl = document.getElementById("auth-alert");
    alertEl.className = "auth-alert" + (success ? " success" : "");
    alertEl.innerHTML = `${Icons.svg(success ? "check" : "alertCircle")}<span>${msg}</span>`;
    alertEl.style.display = "flex";
  }

  document.getElementById("reset-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    document.getElementById("email-error").textContent = "";
    if (!validate.email(email)) { document.getElementById("email-error").textContent = "Enter a valid email."; return; }

    const btn = document.getElementById("reset-submit");
    btn.disabled = true;
    document.getElementById("reset-btn-text").innerHTML = `<span class="spinner" style="border-color:rgba(255,255,255,0.4);border-top-color:#fff;"></span>`;

    try {
      await resetPassword(email);
      showAlert("Reset link sent. Check your inbox for further instructions.", true);
      document.getElementById("reset-form").reset();
    } catch (err) {
      showAlert(friendlyFirebaseError(err));
    } finally {
      btn.disabled = false;
      document.getElementById("reset-btn-text").textContent = "Send reset link";
    }
  });
</script>
</body>
</html>
